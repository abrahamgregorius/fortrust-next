name: Daily AI Blog Generation

on:
  schedule:
    # 00:00 WIB (UTC+7) == 17:00 UTC the previous day
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of articles to generate"
        required: false
        default: "5"

concurrency:
  group: ai-blog-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate 5 articles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Trigger article generation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ARTICLE_COUNT: ${{ github.event.inputs.count || '5' }}
        run: node scripts/generate-articles.mjs
